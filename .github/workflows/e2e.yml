# =============================================================================
# Absolute Palworld Server - E2E Test Workflow
# =============================================================================
# Runs end-to-end tests on every push and pull request.
# Caches server files to speed up subsequent runs.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, develop]
  # Any base, not just main. A pull request stacked on another branch is still
  # a change that has to be gated; filtering on [main] meant stacked work
  # merged with no checks at all and only got tested once the stack landed.
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip server file cache'
        required: false
        default: false
        type: boolean

# Least privilege for GITHUB_TOKEN; no job here writes to the repo.
permissions:
  contents: read

env:
  PALWORLD_APP_ID: '2394010'

jobs:
  # -------------------------------------------------------------------------
  # Static checks (fast, no Docker)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck is preinstalled on ubuntu-latest
      - name: Shellcheck container scripts and tests
        run: |
          shellcheck --version
          shellcheck -S error -s bash -x scripts/* tests/*.sh tests/e2e/*.sh

      # Discovered, not listed. A unit test added to tests/ and forgotten here
      # is a test that never runs, which is worse than not writing it.
      - name: Unit tests
        run: |
          # tests/test_helpers.sh is the shared library, not a test.
          for t in tests/test_*.sh; do
            case "$(basename "${t}")" in test_helpers.sh) continue ;; esac
            echo "--- ${t}"
            bash "${t}"
          done

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------------
      # Checkout and Setup
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---------------------------------------------------------------------
      # Cache Server Files
      # ---------------------------------------------------------------------
      - name: Create cache directories
        run: |
          mkdir -p data/server
          mkdir -p data/config

      - name: Restore server file cache
        if: ${{ github.event.inputs.skip_cache != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: server-cache
        with:
          path: data/server
          key: palworld-server-${{ env.PALWORLD_APP_ID }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            palworld-server-${{ env.PALWORLD_APP_ID }}-

      - name: Cache status
        run: |
          if [ "${{ steps.server-cache.outputs.cache-hit }}" == "true" ]; then
            echo "Server files restored from cache"
            ls -la data/server/ || true
          else
            echo "No cache found, server files will be downloaded"
          fi

      # ---------------------------------------------------------------------
      # Build Docker Image
      # ---------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-palworld-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # Run E2E Tests
      # ---------------------------------------------------------------------
      - name: Make test scripts executable
        run: |
          chmod +x tests/run_e2e.sh
          chmod +x tests/test_helpers.sh
          chmod +x tests/e2e/*.sh

      - name: Cleanup any existing containers
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f palworld-server 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker volume rm palworld-test-config palworld-test-server 2>/dev/null || true

      - name: Run E2E test suite
        id: e2e-tests
        run: |
          ./tests/run_e2e.sh
        env:
          TEST_TIMEOUT: 600
          STARTUP_WAIT: 300

      # ---------------------------------------------------------------------
      # Collect Artifacts (always, for debugging)
      # ---------------------------------------------------------------------
      - name: Collect test logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker logs palworld-server > test-artifacts/container.log 2>&1 || true
          docker inspect palworld-server > test-artifacts/container-inspect.json 2>&1 || true
          cp -r data/logs/* test-artifacts/ 2>/dev/null || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-logs
          path: test-artifacts/
          retention-days: 7

      # The ready-ladder verdict (standard 2.10), on its own so the fleet board's
      # collector can read it without unpacking logs. Transport, not the record:
      # the hub keeps the last conclusive verdict itself (2.11).
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict
          path: data/logs/verdict.json
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------------
      # Update Server File Cache
      # ---------------------------------------------------------------------
      - name: Save server files to cache
        if: always()
        run: |
          # Copy server files from container volume if tests ran
          if docker ps -a | grep -q palworld-server; then
            echo "Extracting server files for cache..."
            docker cp palworld-server:/opt/palworld/server/. data/server/ 2>/dev/null || true
            ls -la data/server/ | head -20 || true
          fi

      # ---------------------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
          docker rm -f palworld-server 2>/dev/null || true
          docker volume rm palworld-test-config palworld-test-server 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Build Verification (no server download)
  # -------------------------------------------------------------------------
  build-only:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-palworld-server:build-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image structure
        run: |
          # Check that required scripts exist
          docker run --rm absolute-palworld-server:build-test ls -la /opt/palworld/scripts/

          # Check that steamcmd is installed
          docker run --rm absolute-palworld-server:build-test ls -la /opt/steamcmd/

          # Check supervisor config
          docker run --rm absolute-palworld-server:build-test cat /etc/supervisor/conf.d/palworld.conf
