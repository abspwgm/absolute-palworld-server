; =============================================================================
; Supervisor configuration for Palworld dedicated server
; =============================================================================

[program:palworld-server]
command=/opt/palworld/scripts/palworld-server start
directory=/opt/palworld/server
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=150
stopsignal=INT
; The wrapper's output goes to the container's stdout, so `docker logs` shows
; what the server and its wrapper actually did - to an operator during an
; incident, and to the e2e suite. In a file it could not be read back from a
; stopped container, and the shutdown test saw nothing at all.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=palworld
; Without this the child inherits supervisord's HOME (/root), which it cannot
; read or write.
environment=HOME="/home/palworld",USER="palworld"
priority=100

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/palworld/supervisor-cron.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/var/log/palworld/supervisor-cron-error.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
user=root
priority=200
